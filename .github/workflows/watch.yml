name: Surveille les patchs de World of Bagarre

# Toutes les 10 minutes :
# 1. si worldofbagarre.com sert une nouvelle version (/v/<commit>/), on mesure tous les persos dans un conteneur sans
#    réseau (le code du jeu y tourne isolé) et on compare à la version d'avant → data/patchnotes.json ;
# 2. on lit le salon « update » du Discord du jeu (suivi dans le serveur NDS) et on accroche chaque message officiel
#    à notre patch note du même patch (section « Patch note officiel ») ;
# 3. on publie si quelque chose a changé (lu par nds-tournament.fr).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Mesurer quand même la version actuelle, sans rien publier (pour vérifier le robot)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: measure

jobs:
  measure:
    runs-on: ubuntu-latest
    # the bot token is stored as a secret of the "DISCORD_BOT_TOKEN" environment (not a repository secret)
    environment:
      name: DISCORD_BOT_TOKEN
      deployment: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version en ligne
        id: v
        run: |
          C=$(node scripts/fetch.mjs)
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          if [ -f "data/$C.json" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mesure (conteneur sans réseau)
        if: steps.v.outputs.new == 'true' || inputs.test
        run: |
          C=${{ steps.v.outputs.commit }}
          docker run --rm --network none --read-only --cap-drop ALL --memory 2g -v "$PWD:/w:ro" -w /w/scripts node:22-alpine node extract.mjs "$C" > "data/$C.json"
          PREV=$(node -e "try{console.log('data/'+require('./data/latest.json').file)}catch(e){}")
          node scripts/diff.mjs "$PREV" "data/$C.json"
          node -e "const d=require('./data/$C.json');console.log('persos mesurés :',Object.keys(d.chars).length)"
      - name: Patch note officiel (Discord)
        if: ${{ !inputs.test }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_UPDATE_CHANNEL: ${{ vars.DISCORD_UPDATE_CHANNEL }}
        run: node scripts/discord.mjs
      - name: Publie
        if: ${{ !inputs.test }}
        run: |
          git add data
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git config user.name "wob-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour ${{ steps.v.outputs.commit }}"
          git push
